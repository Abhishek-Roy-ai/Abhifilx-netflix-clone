services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abhiflix-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key}
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
      - TMDB_API_KEY=${TMDB_API_KEY:-76ac5f7a345a3387df49e85db5230b29}
      - TMDB_BASE_URL=${TMDB_BASE_URL:-https://api.themoviedb.org/3}
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:5000/api/v1}
        - VITE_TMDB_API_KEY=${VITE_TMDB_API_KEY:-76ac5f7a345a3387df49e85db5230b29}
        - VITE_TMDB_BASE_URL=${VITE_TMDB_BASE_URL:-https://api.themoviedb.org/3}
    container_name: abhiflix-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
